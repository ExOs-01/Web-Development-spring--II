<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Assignment 2</title>
</head>
<body>

    <h1>JS Assignment 2</h1>
    <hr>

    <!-- Task 1: Even or Odd -->
    <h2>1. Even or Odd Checker</h2>
    <input type="number" id="evenOddInput" placeholder="Enter a number">
    <button onclick="checkEvenOdd()">Check</button>
    <p id="evenOddResult"></p>
    <hr>

    <!-- Task 2: Multiplication Table -->
    <h2>2. Multiplication Table Generator</h2>
    <input type="number" id="multInput" placeholder="Enter a number">
    <button onclick="multiplicationTable()">Generate</button>
    <pre id="multResult"></pre>
    <hr>

    <!-- Task 3: FizzBuzz -->
    <h2>3. FizzBuzz Challenge</h2>
    <button onclick="fizzBuzz()">Run FizzBuzz</button>
    <pre id="fizzBuzzResult"></pre>
    <hr>

    <!-- Task 4: Square Pattern -->
    <h2>4. Square Pattern</h2>
    <input type="number" id="squareInput" placeholder="Enter n">
    <button onclick="squarePattern()">Print</button>
    <pre id="squareResult"></pre>
    <hr>

    <!-- Task 5: Right-Angled Triangle -->
    <h2>5. Right-Angled Triangle</h2>
    <input type="number" id="triInput" placeholder="Enter n">
    <button onclick="trianglePattern()">Print</button>
    <pre id="triResult"></pre>

    <script src="script.js"></script>
</body>
</html>
